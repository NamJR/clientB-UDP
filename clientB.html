<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebRTC Client B</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #fdfbfb, #ebedee);
      color: #2c3e50;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: #27ae60;
    }

    .btn-group {
      margin: 20px 0;
    }

    button {
      padding: 12px 28px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #27ae60;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    button:hover {
      background-color: #1e8449;
      transform: translateY(-1px);
    }

    .video-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 30px;
    }

    video {
      width: 45%;
      max-width: 480px;
      border-radius: 12px;
      border: 3px solid #ecf0f1;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
    }

    #connectionInfo {
      margin-top: 25px;
      background-color: #ffffffcc;
      padding: 12px 20px;
      border-radius: 8px;
      display: none;
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: inline-block;
    }

    .label {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📞 WebRTC Client B</h1>

    <div class="btn-group">
      <button id="receiveCallButton">Receive Call</button>
    </div>

    <div class="video-container">
      <video id="localVideo" autoplay playsinline muted></video>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div id="connectionInfo">
      🔗 <span class="label">Connection ID:</span>
      <span id="connectionIdDisplay"></span>
    </div>
  </div>

  <script>
    const SERVER_IP = prompt("📡 Nhập IP hoặc hostname của server (ví dụ: 192.168.1.100):", "localhost");
    const SERVER_URL = `http://${SERVER_IP}:5221/api/Signal`;
    let localConnection;
    let connectionId = null;
    let localStream;

    async function getLocalVideoStream() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
        return localStream;
      } catch (err) {
        console.error("❌ Failed to get local stream:", err);
        throw err;
      }
    }

    async function receiveCall() {
      connectionId = prompt("📞 Nhập Connection ID để nhận cuộc gọi từ Client A:");
      if (!connectionId) {
        console.log("❌ Connection ID không được cung cấp");
        return;
      }

      document.getElementById('connectionIdDisplay').textContent = connectionId;
      document.getElementById('connectionInfo').style.display = "inline-block";

      console.log("📥 Đang chờ nhận Offer từ Client A...");
      console.log("🔗 Server URL:", SERVER_URL);
      
      try {
        const response = await fetch(`${SERVER_URL}/offer/${connectionId}`);
        if (!response.ok) {
          throw new Error(`❌ Không lấy được Offer. HTTP Status: ${response.status}`);
        }

        const offer = await response.json();
        console.log("✅ Offer nhận được:", offer);
        await handleOffer(offer);
      } catch (error) {
        console.error("🚨 Lỗi khi nhận cuộc gọi:", error);
        alert("❌ Lỗi: " + error.message);
      }
    }

    async function handleOffer(offer) {
      // Lấy local stream TRƯỚC khi tạo PeerConnection
      localStream = await getLocalVideoStream();

      localConnection = new RTCPeerConnection({
        iceServers: [
          { urls: "stun:stun.l.google.com:19302" },
          { urls: "stun:stun1.l.google.com:19302" },
          { urls: "stun:stun2.l.google.com:19302" },
          {
            urls: 'turn:turn.anyfirewall.com:443?transport=tcp',
            credential: 'webrtc',
            username: 'webrtc'
          }
        ]
      });

      // Thêm local tracks TRƯỚC khi set remote description
      localStream.getTracks().forEach(track => localConnection.addTrack(track, localStream));

      localConnection.onicecandidate = event => {
        if (event.candidate) {
          console.log("🧊 ICE Candidate từ Client B:", event.candidate);
          sendIceCandidate(event.candidate);
        }
      };

      localConnection.oniceconnectionstatechange = () => {
        console.log("🔌 ICE Connection State:", localConnection.iceConnectionState);
        if (localConnection.iceConnectionState === "connected" || localConnection.iceConnectionState === "completed") {
          console.log("✅ ICE Connection thành công!");
        }
      };

      localConnection.ontrack = event => {
        console.log("📡 Received track từ Client A:", event.streams[0]);
        document.getElementById('remoteVideo').srcObject = event.streams[0];
      };

      try {
        // Set remote description từ Offer
        await localConnection.setRemoteDescription(new RTCSessionDescription(offer));
        console.log("✅ Remote Description đã được set");

        // Tạo Answer
        const answer = await localConnection.createAnswer();
        await localConnection.setLocalDescription(answer);
        console.log("✅ Local Description (Answer) đã được set");

        // Gửi Answer lên server
        const response = await fetch(`${SERVER_URL}/answer/${connectionId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(answer),
        });

        if (!response.ok) {
          throw new Error(`❌ Server rejected answer. Status: ${response.status}`);
        }

        console.log("✅ Answer sent to server!");
        
        // Bắt đầu lấy ICE Candidates từ server
        fetchIceCandidates();
      } catch (error) {
        console.error("🚨 Error handling offer:", error);
      }
    }

    async function sendIceCandidate(candidate) {
      if (!connectionId) return;
      try {
        await fetch(`${SERVER_URL}/candidate/${connectionId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(candidate),
        });
      } catch (error) {
        console.error("🚨 Error sending ICE Candidate:", error);
      }
    }

    let iceFetchInterval = null;
    let processedCandidates = new Set();

    async function fetchIceCandidates() {
      if (iceFetchInterval) clearInterval(iceFetchInterval);
      
      iceFetchInterval = setInterval(async () => {
        if (!connectionId || !localConnection || !localConnection.remoteDescription) {
          console.log("⏳ Chờ remote description...");
          return;
        }

        try {
          const response = await fetch(`${SERVER_URL}/candidate/${connectionId}`);
          if (response.ok) {
            const candidates = await response.json();
            
            for (let candidate of candidates) {
              const candidateStr = JSON.stringify(candidate);
              
              // Tránh add candidate trùng lặp
              if (processedCandidates.has(candidateStr)) {
                continue;
              }
              
              processedCandidates.add(candidateStr);
              
              try {
                await localConnection.addIceCandidate(new RTCIceCandidate(candidate));
                console.log("✅ ICE Candidate added:", candidate.candidate);
              } catch (err) {
                if (err.name !== 'InvalidStateError') {
                  console.error("🚨 Error adding ICE Candidate:", err);
                }
              }
            }
          }
        } catch (error) {
          console.error("🚨 Error fetching ICE Candidates:", error);
        }
      }, 500); // Giảm interval từ 1000ms xuống 500ms để nhanh hơn
    }

    document.getElementById('receiveCallButton').addEventListener('click', receiveCall);
  </script>
</body>
</html>
