<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebRTC Client B</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #fdfbfb, #ebedee);
      color: #2c3e50;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: #27ae60;
    }

    .btn-group {
      margin: 20px 0;
    }

    button {
      padding: 12px 28px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #27ae60;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    button:hover {
      background-color: #1e8449;
      transform: translateY(-1px);
    }

    .video-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 30px;
    }

    video {
      width: 45%;
      max-width: 480px;
      border-radius: 12px;
      border: 3px solid #ecf0f1;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
    }

    #connectionInfo {
      margin-top: 25px;
      background-color: #ffffffcc;
      padding: 12px 20px;
      border-radius: 8px;
      display: none;
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: inline-block;
    }

    .label {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📞 WebRTC Client B</h1>

    <div class="btn-group">
      <button id="receiveCallButton">Receive Call</button>
      <button id="checkStatusButton" style="background-color: #e74c3c;">🔍 Check Status</button>
    </div>

    <div class="video-container">
      <video id="localVideo" autoplay playsinline muted></video>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div id="connectionInfo">
      🔗 <span class="label">Connection ID:</span>
      <span id="connectionIdDisplay"></span>
    </div>
  </div>

  <script>
    // Lưu cấu hình server (giống Client A)
    let SERVER_IP = localStorage.getItem('SERVER_IPv4') || prompt("📡 Nhập IPv4 Address của Server (ví dụ: 192.168.1.14):", "192.168.1.14");
    if (!SERVER_IP) {
      alert("❌ Cần nhập IPv4 Address!");
      throw new Error("IPv4 Address không được cấu hình");
    }
    localStorage.setItem('SERVER_IPv4', SERVER_IP);

    let SERVER_PORT = localStorage.getItem('SERVER_PORT') || prompt("Nhập Port Server (mặc định 5221):", "5221") || "5221";
    localStorage.setItem('SERVER_PORT', SERVER_PORT);
    const SERVER_URL = `http://${SERVER_IP}:${SERVER_PORT}/api/Signal`;
    console.log("🔗 Server URL:", SERVER_URL);
    
    let localConnection;
    let connectionId = null;
    let localStream;
    let connectionStatus = "disconnected";
    let iceFetchInterval = null;
    let processedCandidates = new Set();
    let answerSent = false;
    let pendingIceCandidates = [];

    const LAN_PEER_CONFIG = {
      iceServers: [],
      iceCandidatePoolSize: 0,
      bundlePolicy: 'max-bundle',
      rtcpMuxPolicy: 'require'
    };

    const MEDIA_CONSTRAINTS = {
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
      audio: { echoCancellation: true, noiseSuppression: true }
    };

    async function getLocalVideoStream() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia(MEDIA_CONSTRAINTS);
        document.getElementById('localVideo').srcObject = localStream;
        return localStream;
      } catch (err) {
        console.error("❌ Failed to get local stream:", err);
        throw err;
      }
    }

    function queueOrSendIceCandidate(candidate) {
      if (!connectionId || !answerSent) {
        pendingIceCandidates.push(candidate);
        return;
      }
      sendIceCandidate(candidate);
    }

    function flushPendingIceCandidates() {
      while (pendingIceCandidates.length > 0) {
        sendIceCandidate(pendingIceCandidates.shift());
      }
    }

    async function receiveCall() {
      connectionId = prompt("📞 Nhập Connection ID để nhận cuộc gọi từ Client A:");
      if (!connectionId) {
        console.log("❌ Connection ID không được cung cấp");
        return;
      }

      document.getElementById('connectionIdDisplay').textContent = connectionId;
      document.getElementById('connectionInfo').style.display = "inline-block";

      connectionStatus = "connecting";
      console.log("📥 Đang chờ nhận Offer từ Client A...");
      console.log("🔗 Server URL:", SERVER_URL);
      
      // Retry logic - lấy Offer với nhiều lần thử
      const maxRetries = 15;
      let retries = 0;
      
      while (retries < maxRetries) {
        try {
          console.log(`⏳ Lần thử ${retries + 1}/${maxRetries}...`);
          const response = await fetch(`${SERVER_URL}/offer/${connectionId}`, {
            timeout: 5000
          });
          
          if (!response.ok) {
            if (response.status === 404) {
              console.log("⏳ Offer chưa có. Client A chưa gửi offer...");
            } else {
              throw new Error(`HTTP Status: ${response.status}`);
            }
          } else {
            const offer = await response.json();
            console.log("✅ Offer nhận được:", offer);
            await handleOffer(offer);
            return;
          }
        } catch (error) {
          console.error(`🚨 Lần thử ${retries + 1} thất bại:`, error.message);
        }
        
        retries++;
        // Chờ 2 giây trước lần thử tiếp theo
        await new Promise(resolve => setTimeout(resolve, 2000));
      }
      
      connectionStatus = "disconnected";
      console.error("❌ Không lấy được Offer sau " + maxRetries + " lần thử");
      alert("❌ Lỗi: Không thể nhận Offer từ Client A sau " + maxRetries + " lần thử. Kiểm tra:\n1. Client A đã nhấn Start Call chưa?\n2. Connection ID có đúng không?\n3. Server có chạy không?");
    }

    async function handleOffer(offer) {
      try {
        // Lấy local stream TRƯỚC khi tạo PeerConnection
        console.log("🎤 Đang lấy local stream...");
        localStream = await getLocalVideoStream();

        localConnection = new RTCPeerConnection(LAN_PEER_CONFIG);

        console.log("📊 PeerConnection được tạo");

        // Thêm local tracks TRƯỚC khi set remote description
        localStream.getTracks().forEach(track => {
          console.log("🎯 Adding track:", track.kind);
          localConnection.addTrack(track, localStream);
        });

        localConnection.onicecandidate = event => {
          if (event.candidate) {
            console.log("🧊 Candidate từ Client B:", event.candidate.candidate.substring(0, 50) + "...");
            queueOrSendIceCandidate(event.candidate);
          } else {
            console.log("✅ ICE gathering complete");
          }
        };

        localConnection.oniceconnectionstatechange = () => {
          console.log("🔌 ICE Connection State:", localConnection.iceConnectionState);
          if (localConnection.iceConnectionState === "connected") {
            connectionStatus = "connected";
            console.log("✅ ICE Connection thành công!");
          } else if (localConnection.iceConnectionState === "completed") {
            connectionStatus = "connected";
            console.log("✅ ICE Connection completed!");
          } else if (localConnection.iceConnectionState === "failed") {
            connectionStatus = "disconnected";
            console.error("❌ ICE Connection thất bại! Kiểm tra firewall/NAT/TURN server");
            // Thử reconnect
            setTimeout(() => {
              if (connectionStatus === "disconnected") {
                console.log("🔄 Attempting reconnection...");
                receiveCall();
              }
            }, 3000);
          } else if (localConnection.iceConnectionState === "disconnected") {
            connectionStatus = "disconnected";
            console.error("❌ ICE Connection bị ngắt!");
          }
        };

        localConnection.onconnectionstatechange = () => {
          console.log("📡 Connection State:", localConnection.connectionState);
        };

        localConnection.ontrack = event => {
          console.log("📹 Received track từ Client A:", event.track.kind);
          const remoteVideo = document.getElementById('remoteVideo');
          if (event.streams?.length > 0) {
            remoteVideo.srcObject = event.streams[0];
            remoteVideo.play().catch(err => console.warn("Play deferred:", err.message));
            console.log("✅ Remote video stream set successfully");
          }
        };

        localConnection.addEventListener('track', (event) => {
          if (event.track.kind === 'video') {
            console.log("✅ Video track received!");
          }
        });

        // Set remote description từ Offer
        console.log("📋 Setting remote description...");
        await localConnection.setRemoteDescription(new RTCSessionDescription(offer));
        console.log("✅ Remote Description đã được set");

        // Tạo Answer
        console.log("💬 Creating answer...");
        const answer = await localConnection.createAnswer();
        await localConnection.setLocalDescription(answer);
        console.log("✅ Local Description (Answer) đã được set");

        // Gửi Answer lên server
        console.log("📤 Sending answer to server...");
        const response = await fetch(`${SERVER_URL}/answer/${connectionId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(answer),
        });

        if (!response.ok) {
          throw new Error(`Server rejected answer. Status: ${response.status}`);
        }

        answerSent = true;
        console.log("✅ Answer gửi thành công!");
        flushPendingIceCandidates();

        fetchIceCandidates();
      } catch (error) {
        connectionStatus = "disconnected";
        console.error("🚨 Error handling offer:", error);
        alert("❌ Lỗi khi xử lý Offer: " + error.message);
      }
    }

    async function sendIceCandidate(candidate) {
      if (!connectionId || !answerSent) return;
      try {
        await fetch(`${SERVER_URL}/candidate/${connectionId}?role=answerer`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(candidate),
        });
      } catch (error) {
        console.error("🚨 Error sending ICE Candidate:", error.message);
      }
    }

    async function fetchIceCandidates() {
      if (iceFetchInterval) clearInterval(iceFetchInterval);

      processedCandidates.clear();
      console.log("🔄 Bắt đầu lấy ICE Candidates từ Client A...");

      iceFetchInterval = setInterval(async () => {
        if (!connectionId || !localConnection) return;

        if (localConnection.iceConnectionState === "completed" ||
            localConnection.iceConnectionState === "connected") {
          clearInterval(iceFetchInterval);
          iceFetchInterval = null;
          return;
        }

        try {
          const response = await fetch(`${SERVER_URL}/candidate/${connectionId}?role=offerer`);
          if (!response.ok) return;

          const candidates = await response.json();
          if (!candidates?.length) return;

          console.log(`📦 Nhận ${candidates.length} ICE Candidates từ Client A`);

          for (const candidate of candidates) {
            if (!candidate?.candidate) continue;

            const candidateStr = JSON.stringify(candidate);
            if (processedCandidates.has(candidateStr)) continue;
            processedCandidates.add(candidateStr);

            try {
              await localConnection.addIceCandidate(new RTCIceCandidate(candidate));
            } catch (err) {
              if (!err.message.includes('setRemoteDescription')) {
                console.error("🚨 Error adding ICE Candidate:", err.message);
              }
            }
          }
        } catch (error) {
          console.error("🚨 Error fetching ICE Candidates:", error.message);
        }
      }, 300);
    }

    document.getElementById('receiveCallButton').addEventListener('click', receiveCall);

    // Monitor video stream availability
    setInterval(() => {
      const remoteVideo = document.getElementById('remoteVideo');
      if (remoteVideo && remoteVideo.srcObject) {
        const videoTracks = remoteVideo.srcObject.getVideoTracks();
        const audioTracks = remoteVideo.srcObject.getAudioTracks();
        
        if (videoTracks.length > 0 && videoTracks[0].enabled) {
          if (!remoteVideo.srcObject.active) {
            console.warn("⚠️ Remote stream is inactive!");
          }
        }
      }
    }, 5000);
    
    function checkStatus() {
      let status = `📊 Connection Status\n`;
      status += `━━━━━━━━━━━━━━━━━━━━━\n`;
      status += `🔗 Connection ID: ${connectionId || 'Not set'}\n`;
      status += `📡 Status: ${connectionStatus}\n`;
      status += `\n🔌 PeerConnection States:\n`;
      
      if (localConnection) {
        status += `  • Connection: ${localConnection.connectionState}\n`;
        status += `  • ICE: ${localConnection.iceConnectionState}\n`;
        status += `  • ICE Gathering: ${localConnection.iceGatheringState}\n`;
        status += `  • Signaling: ${localConnection.signalingState}\n`;
      } else {
        status += `  • PeerConnection: Not created\n`;
      }
      
      status += `\n📹 Streams:\n`;
      status += `  • Local: ${localStream ? 'Active' : 'Not started'}\n`;
      status += `  • Remote: ${(localConnection && localConnection.remoteDescription) ? 'Ready' : 'Waiting'}\n`;
      
      status += `\n📤 Answer Sent: ${answerSent ? 'Yes' : 'No'}\n`;
      
      console.log(status);
      alert(status);
    }
    
    document.getElementById('checkStatusButton').addEventListener('click', checkStatus);
  </script>
</body>
</html>
