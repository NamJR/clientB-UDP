<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WebRTC Client B</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #fdfbfb, #ebedee);
      color: #2c3e50;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 20px;
      color: #27ae60;
    }

    .btn-group {
      margin: 20px 0;
    }

    button {
      padding: 12px 28px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background-color: #27ae60;
      color: white;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    button:hover {
      background-color: #1e8449;
      transform: translateY(-1px);
    }

    .video-container {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 30px;
    }

    video {
      width: 45%;
      max-width: 480px;
      border-radius: 12px;
      border: 3px solid #ecf0f1;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
    }

    #connectionInfo {
      margin-top: 25px;
      background-color: #ffffffcc;
      padding: 12px 20px;
      border-radius: 8px;
      display: none;
      font-size: 18px;
      font-weight: bold;
      color: #2c3e50;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      display: inline-block;
    }

    .label {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📞 WebRTC Client B</h1>

    <div class="btn-group">
      <button id="receiveCallButton">Receive Call</button>
      <button id="checkStatusButton" style="background-color: #e74c3c;">🔍 Check Status</button>
    </div>

    <div class="video-container">
      <video id="localVideo" autoplay playsinline muted></video>
      <video id="remoteVideo" autoplay playsinline></video>
    </div>

    <div id="connectionInfo">
      🔗 <span class="label">Connection ID:</span>
      <span id="connectionIdDisplay"></span>
    </div>
    <div id="statusInfo" style="margin-top:12px;font-size:16px;color:#555;"></div>
  </div>

  <script>
    function isVirtualIp(ip) {
      const p = ip.split('.').map(Number);
      if (p.length !== 4 || p.some(n => Number.isNaN(n))) return true;
      if (p[0] === 172 && p[1] >= 16 && p[1] <= 31) return true;
      if (p[0] === 127 || p[0] === 26) return true;
      return false;
    }

    function setStatus(text, isError = false) {
      const el = document.getElementById('statusInfo');
      if (el) {
        el.textContent = text;
        el.style.color = isError ? '#c0392b' : '#555';
      }
    }

    // Mỗi lần load: chỉ nhập lại IPv4 (không lưu localStorage). Port mặc định 5221.
    let SERVER_IP = prompt(
      "📡 IP LAN máy chạy server (ipconfig → IPv4):\nvd: 192.168.1.14 — KHÔNG dùng 0.0.0.0 / 172.x.x.x",
      "192.168.1.14"
    );
    if (!SERVER_IP) {
      alert("❌ Cần nhập IPv4 Address!");
      throw new Error("IPv4 Address không được cấu hình");
    }
    SERVER_IP = SERVER_IP.trim();
    if (isVirtualIp(SERVER_IP) || SERVER_IP === '0.0.0.0') {
      alert("❌ IP không hợp lệ. Dùng IP LAN thật (vd: 192.168.1.x)");
      throw new Error("Invalid server IP");
    }

    const SERVER_PORT = "5221";
    const SERVER_URL = `http://${SERVER_IP}:${SERVER_PORT}/api/Signal`;
    console.log("🔗 Server URL:", SERVER_URL);
    setStatus(`Server: ${SERVER_IP}:${SERVER_PORT}`);
    
    let localConnection;
    let connectionId = null;
    let localStream;
    let connectionStatus = "disconnected";
    let iceFetchInterval = null;
    let processedCandidates = new Set();
    let answerSent = false;
    let pendingIceCandidates = [];
    let remoteStreamAssigned = false;

    const LAN_PEER_CONFIG = {
      iceServers: [],
      iceCandidatePoolSize: 0,
      bundlePolicy: 'max-bundle',
      rtcpMuxPolicy: 'require',
      iceTransportPolicy: 'all'
    };

    const MEDIA_CONSTRAINTS = {
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } },
      audio: { echoCancellation: true, noiseSuppression: true }
    };

    function shouldSendLanCandidate(candidate) {
      const line = candidate?.candidate || '';
      if (!line) return false;
      if (line.includes(' tcp ')) return false;
      if (line.includes('::')) return false;
      const match = line.match(/(\d+\.\d+\.\d+\.\d+)/);
      if (!match) return true;
      return !isVirtualIp(match[1]);
    }

    function attachRemoteVideo(stream) {
      const remoteVideo = document.getElementById('remoteVideo');
      remoteVideo.srcObject = stream;
      const tryPlay = () => remoteVideo.play().catch(() => {});
      stream.getVideoTracks().forEach(t => { t.onunmute = tryPlay; });
      tryPlay();
    }

    function startIceCandidatePolling(peerRole) {
      if (iceFetchInterval) clearInterval(iceFetchInterval);
      let emptyPolls = 0;

      iceFetchInterval = setInterval(async () => {
        if (!connectionId || !localConnection) return;

        const ice = localConnection.iceConnectionState;
        if (ice === 'connected' || ice === 'completed') {
          emptyPolls++;
          if (emptyPolls >= 5) {
            clearInterval(iceFetchInterval);
            iceFetchInterval = null;
            setStatus('✅ Đang nhận video từ Client A');
          }
          return;
        }
        if (ice === 'failed' || ice === 'closed') {
          clearInterval(iceFetchInterval);
          iceFetchInterval = null;
          return;
        }

        try {
          const response = await fetch(`${SERVER_URL}/candidate/${connectionId}?role=${peerRole}`);
          if (!response.ok) return;
          const candidates = await response.json();
          if (!candidates?.length) return;

          for (const c of candidates) {
            if (!c?.candidate) continue;
            const key = JSON.stringify(c);
            if (processedCandidates.has(key)) continue;
            processedCandidates.add(key);
            try {
              await localConnection.addIceCandidate(new RTCIceCandidate(c));
            } catch (err) {
              if (!err.message?.includes('setRemoteDescription')) {
                console.warn('ICE add:', err.message);
              }
            }
          }
        } catch (err) {
          console.error('ICE poll:', err);
        }
      }, 250);
    }

    async function getLocalVideoStream() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia(MEDIA_CONSTRAINTS);
        document.getElementById('localVideo').srcObject = localStream;
        return localStream;
      } catch (err) {
        console.error("❌ Failed to get local stream:", err);
        throw err;
      }
    }

    function queueOrSendIceCandidate(candidate) {
      if (!shouldSendLanCandidate(candidate)) return;
      if (!connectionId || !answerSent) {
        pendingIceCandidates.push(candidate);
        return;
      }
      sendIceCandidate(candidate);
    }

    function flushPendingIceCandidates() {
      while (pendingIceCandidates.length > 0) {
        sendIceCandidate(pendingIceCandidates.shift());
      }
    }

    async function receiveCall() {
      connectionId = (prompt("📞 Nhập Connection ID từ Client A (copy nguyên, không thêm khoảng trắng):") || "").trim();
      if (!connectionId) {
        console.log("❌ Connection ID không được cung cấp");
        return;
      }

      document.getElementById('connectionIdDisplay').textContent = connectionId;
      document.getElementById('connectionInfo').style.display = "inline-block";

      connectionStatus = "connecting";
      setStatus("⏳ Đang lấy Offer từ server…");

      const maxRetries = 120;
      let retries = 0;

      while (retries < maxRetries) {
        try {
          const response = await fetch(`${SERVER_URL}/offer/${connectionId}`);

          if (response.status === 404) {
            setStatus("❌ Connection ID sai hoặc Client A chưa Start Call", true);
            alert("❌ Connection ID không tồn tại trên server.\nKiểm tra Client A đã Start Call và ID copy đúng.");
            return;
          }
          if (response.status === 204) {
            // chờ Client A
          } else if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          } else {
            const offer = await response.json();
            await handleOffer(offer);
            return;
          }
        } catch (error) {
          console.error(`Lần thử ${retries + 1}:`, error.message);
        }

        retries++;
        await new Promise(resolve => setTimeout(resolve, 500));
      }
      
      connectionStatus = "disconnected";
      setStatus("❌ Không nhận được Offer — kiểm tra IP server và Connection ID", true);
      alert("❌ Không lấy được Offer sau 60 giây.\n1. Client A đã Start Call?\n2. Cùng IP server?\n3. Connection ID đúng?");
    }

    async function handleOffer(offer) {
      try {
        answerSent = false;
        remoteStreamAssigned = false;
        processedCandidates.clear();
        pendingIceCandidates = [];

        setStatus("🎤 Đang mở camera…");
        localStream = await getLocalVideoStream();
        localConnection = new RTCPeerConnection(LAN_PEER_CONFIG);

        localStream.getTracks().forEach(track => localConnection.addTrack(track, localStream));

        localConnection.onicecandidate = event => {
          if (event.candidate) queueOrSendIceCandidate(event.candidate);
        };

        localConnection.oniceconnectionstatechange = () => {
          const ice = localConnection.iceConnectionState;
          if (ice === 'connected' || ice === 'completed') {
            connectionStatus = 'connected';
            setStatus('✅ ICE kết nối — nhận video từ Client A…');
          } else if (ice === 'failed') {
            connectionStatus = 'disconnected';
            setStatus('❌ ICE thất bại — kiểm tra firewall UDP', true);
          }
        };

        localConnection.ontrack = event => {
          if (!event.streams?.[0] || remoteStreamAssigned) return;
          remoteStreamAssigned = true;
          attachRemoteVideo(event.streams[0]);
        };

        await localConnection.setRemoteDescription(new RTCSessionDescription(offer));

        const answer = await localConnection.createAnswer();
        await localConnection.setLocalDescription(answer);

        setStatus("📤 Gửi Answer lên server…");
        const response = await fetch(`${SERVER_URL}/answer/${connectionId}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(answer),
        });

        if (!response.ok) throw new Error(`Server rejected answer (${response.status})`);

        answerSent = true;
        flushPendingIceCandidates();
        setStatus("⏳ Hoàn tất signaling — thiết lập ICE…");
        startIceCandidatePolling('offerer');
      } catch (error) {
        connectionStatus = "disconnected";
        console.error("🚨 Error handling offer:", error);
        alert("❌ Lỗi khi xử lý Offer: " + error.message);
      }
    }

    async function sendIceCandidate(candidate) {
      if (!connectionId || !answerSent) return;
      try {
        await fetch(`${SERVER_URL}/candidate/${connectionId}?role=answerer`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(candidate),
        });
      } catch (error) {
        console.error("🚨 Error sending ICE Candidate:", error.message);
      }
    }

    document.getElementById('receiveCallButton').addEventListener('click', receiveCall);

    function checkStatus() {
      let status = `📊 Connection Status\n`;
      status += `━━━━━━━━━━━━━━━━━━━━━\n`;
      status += `🔗 Server: ${SERVER_IP}:${SERVER_PORT}\n`;
      status += `🔗 Connection ID: ${connectionId || 'Not set'}\n`;
      status += `📡 Status: ${connectionStatus}\n`;
      status += `\n🔌 PeerConnection States:\n`;
      
      if (localConnection) {
        status += `  • Connection: ${localConnection.connectionState}\n`;
        status += `  • ICE: ${localConnection.iceConnectionState}\n`;
        status += `  • ICE Gathering: ${localConnection.iceGatheringState}\n`;
        status += `  • Signaling: ${localConnection.signalingState}\n`;
      } else {
        status += `  • PeerConnection: Not created\n`;
      }
      
      status += `\n📹 Streams:\n`;
      status += `  • Local: ${localStream ? 'Active' : 'Not started'}\n`;
      status += `  • Remote: ${remoteStreamAssigned ? 'Receiving' : 'Waiting'}\n`;
      status += `\n📤 Answer Sent: ${answerSent ? 'Yes' : 'No'}\n`;
      
      console.log(status);
      alert(status);
    }
    
    document.getElementById('checkStatusButton').addEventListener('click', checkStatus);
  </script>
</body>
</html>
